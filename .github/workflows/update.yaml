name: update-g-hub-list
run-name: Check and update list
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update-g-hub-list:
    runs-on: windows-latest
    steps:
    - name: Download installer
      run: |
        set INSTALLER_URL=https://download01.logi.com/web/ftp/pub/techsupport/gaming/lghub_installer.exe
        curl -L -o %TEMP%\installer.exe %INSTALLER_URL%
      shell: cmd

    - name: Install application
      run: |
        %TEMP%\installer.exe --silent
      shell: cmd

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run Python and update list if there was a software update
      id: update
      run: |
        # stdout is the new version (empty if the repository is already up to date); stderr goes to the log
        version=$(python update_list.py)
        echo "version=$version" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Check for an open PR for this update
      id: existing
      if: ${{ steps.update.outputs.version != '' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # ghub_version.txt now holds the full version just installed
        new_version=$(tr -d '[:space:]' < ghub_version.txt)
        exists=false
        if [ "$(gh pr list --head update --state open --json number --jq length)" != "0" ]; then
          # An open PR exists: is it already for this exact G HUB version?
          if git fetch --depth=1 origin update &&
             [ "$(git show FETCH_HEAD:ghub_version.txt | tr -d '[:space:]')" = "$new_version" ]; then
            exists=true
          fi
        fi
        echo "exists=$exists" >> "$GITHUB_OUTPUT"
        if [ "$exists" = true ]; then
          echo "An open PR for G HUB $new_version already exists, not creating a commit or PR"
        fi
      shell: bash

    - name: Create a PR if the list was updated
      if: ${{ steps.update.outputs.version != '' && steps.existing.outputs.exists != 'true' }}
      uses: peter-evans/create-pull-request@v8
      with:
        branch: update
        commit-message: Update for G HUB version ${{ steps.update.outputs.version }}
        title: Update for G HUB version ${{ steps.update.outputs.version }}
